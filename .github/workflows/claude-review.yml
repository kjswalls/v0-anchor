# Claude Code review on every PR — replaces CodeRabbit (see .coderabbit.yaml).
# Runs on Opus at `high` effort so it reviews thoroughly rather than only
# flagging the few highest-confidence issues (the default was quiet on clean-
# looking PRs). Billed against the CLAUDE_CODE_OAUTH_TOKEN owner's Claude
# subscription, so the concurrency group cancels superseded runs instead of
# paying to review a force-push twice.
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude review
    # Drafts wait until they're ready; a `skip-review` label opts a PR out.
    if: >-
      !github.event.pull_request.draft &&
      !contains(github.event.pull_request.labels.*.name, 'skip-review')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the review can diff against the merge base.
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          # `high` effort casts a wider net (broader coverage, includes
          # lower-confidence findings) instead of the default's few
          # high-confidence-only ones — a clean-looking PR should still get
          # scrutiny. Bump to `max` if even that reads as too quiet.
          prompt: "/code-review:code-review high --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # Two args, both load-bearing:
          #  --model: review on Opus, not the action's default (Sonnet).
          #  --allowedTools: --comment alone is not enough — the inline-comment
          #    MCP tool must be explicitly allowed or findings arrive as one blob.
          claude_args: '--model claude-opus-4-8 --allowedTools "mcp__github_inline_comment__create_inline_comment"'
