# Claude Code review on every PR — replaces CodeRabbit (see .coderabbit.yaml).
# Billed against the CLAUDE_CODE_OAUTH_TOKEN owner's Claude subscription, so
# the concurrency group cancels superseded runs instead of paying to review a
# force-push twice.
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude review
    # Drafts wait until they're ready; a `skip-review` label opts a PR out.
    if: >-
      !github.event.pull_request.draft &&
      !contains(github.event.pull_request.labels.*.name, 'skip-review')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the review can diff against the merge base.
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # --comment alone is not enough: the inline-comment MCP tool must be
          # explicitly allowed or findings arrive as one blob comment.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
