<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Inter', system-ui, sans-serif; }
    a { color: oklch(0.32 0.07 130); } a:hover { color: oklch(0.24 0.01 272); }
    .anchor {
      --paper-0: oklch(0.986 0.0012 90);
      --pill: oklch(1 0 0);
      --well: oklch(0.945 0.0015 90);
      --ink-0: oklch(0.24 0.01 272);
      --ink-2: oklch(0.66 0.03 272);
      --lime-ink: oklch(0.32 0.07 130);
      --lime-tint: oklch(0.95 0.05 125);
      --honey-ink: oklch(0.38 0.08 75);
      --hairline: oklch(0.9 0.008 272 / 45%);
      --sh-elev-md: 0 4px 10px oklch(0 0 0 / 14%), 0 2px 4px oklch(0 0 0 / 8%);
      --sh-soft-sm: 0 1px 2px oklch(0.3 0.02 80 / 5%), 0 2px 8px oklch(0.3 0.02 80 / 5%);
    }
  </style>
</helmet>
<div class="anchor" style="width: 390px; height: 430px; background: var(--paper-0); color: var(--ink-0); overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 16px 16px; gap: 8px; font-family: 'Inter', system-ui, sans-serif;">

  <!-- The mode card, opened: surfaces AND the view toggle live in one sheet,
       so the header carries no toggle at all. -->
  <div style="background: var(--pill); border: 1px solid var(--well); border-radius: 20px; box-shadow: var(--sh-elev-md); padding: 8px; display: flex; flex-direction: column;">
    <div style="display: flex; align-items: center; gap: 10px; padding: 10px 10px; border-radius: 12px; color: var(--ink-2);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 12H3"></path><path d="M17 18H3"></path><path d="M21 6H3"></path></svg>
      <span style="font-size: 14px; font-weight: 500;">Braindump</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 10px 10px; border-radius: 12px; background: var(--lime-tint); color: var(--lime-ink);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg>
      <span style="font-size: 14px; font-weight: 600;">Today</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 10px 10px; border-radius: 12px; color: var(--ink-2);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"></path></svg>
      <span style="font-size: 14px; font-weight: 500;">Beacon</span>
    </div>
    <div style="height: 1px; background: var(--hairline); margin: 6px -8px;"></div>
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 6px 10px 4px;">
      <span style="font-size: 12px; font-weight: 500; color: var(--ink-2);">View</span>
      <div style="display: flex; gap: 2px; background: var(--well); border-radius: 10px; padding: 2px;">
        <div style="width: 34px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: var(--pill); box-shadow: var(--sh-soft-sm); color: var(--ink-0);">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M21 9H3"></path><path d="M21 15H3"></path></svg>
        </div>
        <div style="width: 34px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--ink-2);">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h.01"></path><path d="M3 18h.01"></path><path d="M3 6h.01"></path><path d="M8 12h13"></path><path d="M8 18h13"></path><path d="M8 6h13"></path></svg>
        </div>
        <div style="width: 34px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--ink-2);">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        </div>
      </div>
    </div>
  </div>

  <!-- The bar underneath, mode card active -->
  <div style="display: flex; align-items: center; gap: 8px;">
    <div style="width: 56px; height: 56px; flex-shrink: 0; background: var(--pill); border: 1px solid var(--well); border-radius: 18px; box-shadow: var(--sh-elev-md); display: flex; align-items: center; justify-content: center;">
      <div style="width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: var(--lime-tint); color: var(--lime-ink);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg>
      </div>
    </div>
    <div style="flex: 1; height: 56px; background: var(--pill); border: 1px solid var(--well); border-radius: 18px; box-shadow: var(--sh-elev-md); display: flex; align-items: center; gap: 10px; padding: 0 8px 0 14px;">
      <span style="flex: 1; font-size: 14px; color: var(--ink-2);">Add, search, or /command…</span>
      <div style="width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--honey-ink);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"></path></svg>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
