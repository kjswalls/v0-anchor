<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Inter', system-ui, sans-serif; }
    a { color: oklch(0.32 0.07 130); } a:hover { color: oklch(0.24 0.01 272); }
    .anchor {
      --paper-0: oklch(0.986 0.0012 90);
      --pill: oklch(1 0 0);
      --well: oklch(0.945 0.0015 90);
      --ink-0: oklch(0.24 0.01 272);
      --ink-1: oklch(0.5 0.02 272);
      --ink-2: oklch(0.66 0.03 272);
      --lime: oklch(0.86 0.17 125);
      --lime-ink: oklch(0.32 0.07 130);
      --honey-ink: oklch(0.38 0.08 75);
      --coral: oklch(0.72 0.14 30);
      --input: oklch(0.86 0.012 272);
      --sh-elev-sm: 0 4px 4px oklch(0 0 0 / 14%), 0 1px 2px oklch(0 0 0 / 8%);
      --sh-soft-sm: 0 1px 2px oklch(0.3 0.02 80 / 5%), 0 2px 8px oklch(0.3 0.02 80 / 5%);
      --sh-soft-lg: 0 4px 8px oklch(0.3 0.02 80 / 6%), 0 16px 48px oklch(0.3 0.02 80 / 10%);
    }
  </style>
</helmet>
<div class="anchor" style="width: 390px; height: 844px; background: var(--paper-0); color: var(--ink-0); display: flex; flex-direction: column; overflow: hidden; font-family: 'Inter', system-ui, sans-serif;">

  <!-- Alternate: header + strip as ONE white card, content bare on paper -->
  <div style="margin: 10px 10px 0; background: var(--pill); border: 1px solid var(--well); border-radius: 20px; box-shadow: var(--sh-elev-sm); padding: 10px 12px 8px; display: flex; flex-direction: column; gap: 8px;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <div style="display: flex; align-items: baseline; gap: 7px;">
          <span style="font-size: 16px; font-weight: 600; letter-spacing: -0.01em;">Today</span>
          <span style="font-size: 13px; color: var(--ink-2);">Mon, Aug 24</span>
        </div>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--ink-2);"><path d="m6 9 6 6 6-6"></path></svg>
      </div>
      <div style="display: flex; align-items: center; gap: 10px;">
        <div style="display: flex; gap: 2px;">
          <div style="width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--ink-2);">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h.01"></path><path d="M3 18h.01"></path><path d="M3 6h.01"></path><path d="M8 12h13"></path><path d="M8 18h13"></path><path d="M8 6h13"></path></svg>
          </div>
          <div style="width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--ink-2);">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="21" x2="14" y1="4" y2="4"></line><line x1="10" x2="3" y1="4" y2="4"></line><line x1="21" x2="12" y1="12" y2="12"></line><line x1="8" x2="3" y1="12" y2="12"></line><line x1="21" x2="16" y1="20" y2="20"></line><line x1="12" x2="3" y1="20" y2="20"></line><line x1="14" x2="14" y1="2" y2="6"></line><line x1="8" x2="8" y1="10" y2="14"></line><line x1="16" x2="16" y1="18" y2="22"></line></svg>
          </div>
        </div>
        <div style="width: 30px; height: 30px; border-radius: 999px; background: var(--lime); color: var(--lime-ink); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600;">K</div>
      </div>
    </div>
    <div style="display: flex; justify-content: space-between; padding: 0 4px;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 3px;">
        <span style="font-size: 9px; font-weight: 500; color: var(--ink-2);">S</span>
        <span style="height: 20px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; color: var(--ink-1);">23</span>
        <span style="width: 16px; height: 3px; border-radius: 2px; background: transparent;"></span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 3px;">
        <span style="font-size: 9px; font-weight: 500; color: var(--lime-ink);">M</span>
        <span style="height: 20px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: var(--lime-ink);">24</span>
        <span style="width: 16px; height: 3px; border-radius: 2px; background: var(--lime);"></span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 3px;">
        <span style="font-size: 9px; font-weight: 500; color: var(--ink-2);">T</span>
        <span style="height: 20px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; color: var(--ink-1);">25</span>
        <span style="width: 16px; height: 3px; border-radius: 2px; background: transparent;"></span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 3px;">
        <span style="font-size: 9px; font-weight: 500; color: var(--ink-2);">W</span>
        <span style="height: 20px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; color: var(--ink-1);">26</span>
        <span style="width: 16px; height: 3px; border-radius: 2px; background: transparent;"></span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 3px;">
        <span style="font-size: 9px; font-weight: 500; color: var(--ink-2);">T</span>
        <span style="height: 20px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; color: var(--ink-1);">27</span>
        <span style="width: 16px; height: 3px; border-radius: 2px; background: transparent;"></span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 3px;">
        <span style="font-size: 9px; font-weight: 500; color: var(--ink-2);">F</span>
        <span style="height: 20px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; color: var(--ink-1);">28</span>
        <span style="width: 16px; height: 3px; border-radius: 2px; background: transparent;"></span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 3px;">
        <span style="font-size: 9px; font-weight: 500; color: var(--ink-2);">S</span>
        <span style="height: 20px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; color: var(--ink-1);">29</span>
        <span style="width: 16px; height: 3px; border-radius: 2px; background: transparent;"></span>
      </div>
    </div>
  </div>

  <!-- Content bare on paper, no divider needed — the card provides the break -->
  <div style="flex: 1; min-height: 0; overflow: hidden; padding: 14px 20px 0; display: flex; flex-direction: column;">
    <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); padding-bottom: 2px;">Habits</span>
    <div style="display: flex; align-items: center; gap: 10px; padding: 7px 0; min-height: 42px;">
      <div style="width: 20px; height: 20px; border-radius: 6px; background: var(--lime); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="color: var(--lime-ink);"><path d="M20 6 9 17l-5-5"></path></svg>
      </div>
      <span style="flex: 1; font-size: 14px; font-weight: 500; color: var(--ink-2); text-decoration: line-through;">Meditate</span>
      <div style="display: flex; align-items: center; gap: 3px; color: var(--honey-ink);">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path></svg>
        <span style="font-size: 12px; font-weight: 600;">12</span>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 7px 0; min-height: 42px;">
      <div style="width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--input); background: var(--pill); flex-shrink: 0;"></div>
      <span style="flex: 1; font-size: 14px; font-weight: 500;">Morning run</span>
      <span style="font-size: 12px; color: var(--ink-2);">7:30</span>
      <div style="display: flex; align-items: center; gap: 3px; color: var(--honey-ink);">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path></svg>
        <span style="font-size: 12px; font-weight: 600;">5</span>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 7px 0; min-height: 42px;">
      <div style="width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--input); background: var(--pill); flex-shrink: 0;"></div>
      <span style="flex: 1; font-size: 14px; font-weight: 500;">Read 20 pages</span>
      <div style="display: flex; align-items: center; gap: 3px; color: var(--honey-ink);">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path></svg>
        <span style="font-size: 12px; font-weight: 600;">21</span>
      </div>
    </div>

    <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); padding: 14px 0 2px;">Tasks</span>
    <div style="display: flex; align-items: center; gap: 10px; padding: 7px 0; min-height: 42px;">
      <div style="width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--input); background: var(--pill); flex-shrink: 0;"></div>
      <span style="flex: 1; font-size: 14px; font-weight: 500;">Ship weekly review email</span>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--coral);"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path><line x1="4" x2="4" y1="22" y2="15"></line></svg>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 7px 0; min-height: 42px;">
      <div style="width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--input); background: var(--pill); flex-shrink: 0;"></div>
      <span style="flex: 1; font-size: 14px; font-weight: 500;">Draft Q3 goals doc</span>
      <span style="font-size: 12px; color: var(--ink-2);">2:00 · 45m</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 7px 0; min-height: 42px;">
      <div style="width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--input); background: var(--pill); flex-shrink: 0;"></div>
      <span style="flex: 1; font-size: 14px; font-weight: 500;">Call dentist about crown</span>
      <span style="font-size: 12px; color: var(--ink-2);">4:00</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 7px 0; min-height: 42px;">
      <div style="width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--input); background: var(--pill); flex-shrink: 0;"></div>
      <span style="flex: 1; font-size: 14px; font-weight: 500;">Plan tomorrow</span>
    </div>
  </div>

  <!-- Dock card -->
  <div style="padding: 8px 10px 12px;">
  <div style="background: var(--well); border-radius: 24px; padding: 10px; box-shadow: var(--sh-soft-lg); display: flex; align-items: center; gap: 8px;">
    <div style="width: 44px; height: 44px; flex-shrink: 0; background: var(--pill); border-radius: 14px; box-shadow: var(--sh-soft-sm); display: flex; align-items: center; justify-content: center; color: var(--ink-0);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg>
    </div>
    <div style="flex: 1; height: 52px; background: var(--pill); border-radius: 16px; box-shadow: var(--sh-soft-sm); display: flex; align-items: center; padding: 0 14px;">
      <span style="flex: 1; font-size: 14px; color: var(--ink-2);">Add, search, or /command…</span>
    </div>
  </div>
  </div>
</div>
</x-dc>
</body>
</html>
