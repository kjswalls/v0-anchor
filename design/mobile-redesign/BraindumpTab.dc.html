<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Inter', system-ui, sans-serif; }
    a { color: oklch(0.32 0.07 130); } a:hover { color: oklch(0.24 0.01 272); }
    .anchor {
      --paper-0: oklch(0.986 0.0012 90);
      --pill: oklch(1 0 0);
      --well: oklch(0.945 0.0015 90);
      --ink-0: oklch(0.24 0.01 272);
      --ink-1: oklch(0.5 0.02 272);
      --ink-2: oklch(0.66 0.03 272);
      --lime: oklch(0.86 0.17 125);
      --lime-ink: oklch(0.32 0.07 130);
      --coral: oklch(0.72 0.14 30);
      --input: oklch(0.86 0.012 272);
      --hairline: oklch(0.9 0.008 272 / 45%);
      --sh-soft-sm: 0 1px 2px oklch(0.3 0.02 80 / 5%), 0 2px 8px oklch(0.3 0.02 80 / 5%);
      --sh-soft-lg: 0 4px 8px oklch(0.3 0.02 80 / 6%), 0 16px 48px oklch(0.3 0.02 80 / 10%);
    }
  </style>
</helmet>
<div class="anchor" style="width: 390px; height: 844px; background: var(--paper-0); color: var(--ink-0); display: flex; flex-direction: column; overflow: hidden; font-family: 'Inter', system-ui, sans-serif;">

  <!-- Braindump tab: same shell, no week strip (this surface is dateless).
       Display filter keeps its ghost icon; the view cycler doesn't apply here. -->
  <div style="padding: 16px 20px 0; display: flex; align-items: center; justify-content: space-between;">
    <span style="font-size: 16px; font-weight: 600; letter-spacing: -0.01em;">Braindump</span>
    <div style="display: flex; align-items: center; gap: 10px;">
      <div style="width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--ink-2);">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="21" x2="14" y1="4" y2="4"></line><line x1="10" x2="3" y1="4" y2="4"></line><line x1="21" x2="12" y1="12" y2="12"></line><line x1="8" x2="3" y1="12" y2="12"></line><line x1="21" x2="16" y1="20" y2="20"></line><line x1="12" x2="3" y1="20" y2="20"></line><line x1="14" x2="14" y1="2" y2="6"></line><line x1="8" x2="8" y1="10" y2="14"></line><line x1="16" x2="16" y1="18" y2="22"></line></svg>
      </div>
      <div style="width: 30px; height: 30px; border-radius: 999px; background: var(--lime); color: var(--lime-ink); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600;">K</div>
    </div>
  </div>

  <!-- Loose items -->
  <div style="flex: 1; min-height: 0; overflow: hidden; padding: 14px 14px 0; display: flex; flex-direction: column; gap: 10px;">
    <div style="background: var(--pill); border: 1px solid var(--well); border-radius: 16px; box-shadow: var(--sh-soft-sm); padding: 8px 14px; display: flex; flex-direction: column;">
      <div style="display: flex; align-items: center; gap: 10px; padding: 7px 4px; min-height: 42px; border-bottom: 1px solid var(--hairline);">
        <div style="width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--input); background: var(--pill); flex-shrink: 0;"></div>
        <span style="flex: 1; font-size: 14px; font-weight: 500;">Book flights for October trip</span>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--coral);"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path><line x1="4" x2="4" y1="22" y2="15"></line></svg>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; padding: 7px 4px; min-height: 42px; border-bottom: 1px solid var(--hairline);">
        <div style="width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--input); background: var(--pill); flex-shrink: 0;"></div>
        <span style="flex: 1; font-size: 14px; font-weight: 500;">Research standing desks</span>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; padding: 7px 4px; min-height: 42px; border-bottom: 1px solid var(--hairline);">
        <div style="width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--input); background: var(--pill); flex-shrink: 0;"></div>
        <span style="flex: 1; font-size: 14px; font-weight: 500;">Email accountant re: Q3 estimates</span>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; padding: 7px 4px; min-height: 42px; border-bottom: 1px solid var(--hairline);">
        <div style="width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--input); background: var(--pill); flex-shrink: 0;"></div>
        <span style="flex: 1; font-size: 14px; font-weight: 500;">Fix the garage door sensor</span>
        <span style="font-size: 12px; color: var(--ink-2);">30m</span>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; padding: 7px 4px; min-height: 42px;">
        <div style="width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--input); background: var(--pill); flex-shrink: 0;"></div>
        <span style="flex: 1; font-size: 14px; font-weight: 500;">Pick a birthday gift for Sam</span>
      </div>
    </div>

    <!-- Paused section -->
    <div style="background: var(--pill); border: 1px solid var(--well); border-radius: 16px; box-shadow: var(--sh-soft-sm); padding: 10px 14px; display: flex; flex-direction: column;">
      <div style="display: flex; align-items: center; gap: 6px; padding-bottom: 2px;">
        <span style="font-size: 12px; font-weight: 600; color: var(--ink-2);">Paused</span>
        <span style="font-size: 11px; color: var(--ink-2);">2</span>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; padding: 7px 4px; min-height: 42px;">
        <div style="width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--input); background: var(--pill); flex-shrink: 0; opacity: 0.6;"></div>
        <span style="flex: 1; font-size: 14px; font-weight: 500; color: var(--ink-2);">Learn woodworking basics</span>
      </div>
    </div>
  </div>

  <!-- Scope rail: which container the list shows -->
  <div style="padding: 10px 14px 0; display: flex; gap: 6px;">
    <div style="height: 30px; padding: 0 12px; border-radius: 10px; background: var(--well); display: flex; align-items: center; gap: 5px; color: var(--ink-0);">
      <span style="font-size: 12px; font-weight: 600;">Braindump</span>
      <span style="font-size: 11px; color: var(--ink-1);">6</span>
    </div>
    <div style="height: 30px; padding: 0 12px; border-radius: 10px; background: var(--pill); border: 1px solid var(--well); display: flex; align-items: center; gap: 5px; color: var(--ink-2);">
      <span style="font-size: 12px; font-weight: 500;">Projects</span>
      <span style="font-size: 11px;">3</span>
    </div>
    <div style="height: 30px; padding: 0 12px; border-radius: 10px; background: var(--pill); border: 1px solid var(--well); display: flex; align-items: center; gap: 5px; color: var(--ink-2);">
      <span style="font-size: 12px; font-weight: 500;">Goals</span>
      <span style="font-size: 11px;">2</span>
    </div>
  </div>

  <!-- Dock card: mode card shows the Braindump glyph -->
  <div style="padding: 8px 10px 12px;">
  <div style="background: var(--well); border-radius: 24px; padding: 10px; box-shadow: var(--sh-soft-lg); display: flex; align-items: center; gap: 8px;">
    <div style="width: 44px; height: 44px; flex-shrink: 0; background: var(--pill); border-radius: 14px; box-shadow: var(--sh-soft-sm); display: flex; align-items: center; justify-content: center; color: var(--ink-0);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M15 12H3"></path><path d="M17 18H3"></path><path d="M21 6H3"></path></svg>
    </div>
    <div style="flex: 1; height: 52px; background: var(--pill); border-radius: 16px; box-shadow: var(--sh-soft-sm); display: flex; align-items: center; padding: 0 14px;">
      <span style="flex: 1; font-size: 14px; color: var(--ink-2);">Add, search, or /command…</span>
    </div>
  </div>
  </div>
</div>
</x-dc>
</body>
</html>
