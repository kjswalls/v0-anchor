<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Inter', system-ui, sans-serif; }
    a { color: oklch(0.32 0.07 130); } a:hover { color: oklch(0.24 0.01 272); }
    .anchor {
      --paper-0: oklch(0.986 0.0012 90);
      --pill: oklch(1 0 0);
      --well: oklch(0.945 0.0015 90);
      --ink-0: oklch(0.24 0.01 272);
      --ink-2: oklch(0.66 0.03 272);
      --honey-ink: oklch(0.38 0.08 75);
      --sh-elev-md: 0 4px 10px oklch(0 0 0 / 14%), 0 2px 4px oklch(0 0 0 / 8%);
      --sh-soft-sm: 0 1px 2px oklch(0.3 0.02 80 / 5%), 0 2px 8px oklch(0.3 0.02 80 / 5%);
    }
  </style>
</helmet>
<div class="anchor" style="width: 390px; height: 300px; background: var(--paper-0); color: var(--ink-0); overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 16px 16px; gap: 8px; font-family: 'Inter', system-ui, sans-serif;">

  <!-- Alternate: view + display live as small chips above the command bar,
       right-aligned — the header carries only date + K -->
  <div style="display: flex; justify-content: flex-end; gap: 6px;">
    <div style="width: 34px; height: 28px; border-radius: 10px; background: var(--pill); border: 1px solid var(--well); box-shadow: var(--sh-soft-sm); display: flex; align-items: center; justify-content: center; color: var(--ink-2);">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M21 9H3"></path><path d="M21 15H3"></path></svg>
    </div>
    <div style="width: 34px; height: 28px; border-radius: 10px; background: var(--pill); border: 1px solid var(--well); box-shadow: var(--sh-soft-sm); display: flex; align-items: center; justify-content: center; color: var(--ink-2);">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="21" x2="14" y1="4" y2="4"></line><line x1="10" x2="3" y1="4" y2="4"></line><line x1="21" x2="12" y1="12" y2="12"></line><line x1="8" x2="3" y1="12" y2="12"></line><line x1="21" x2="16" y1="20" y2="20"></line><line x1="12" x2="3" y1="20" y2="20"></line><line x1="14" x2="14" y1="2" y2="6"></line><line x1="8" x2="8" y1="10" y2="14"></line><line x1="16" x2="16" y1="18" y2="22"></line></svg>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 8px;">
    <div style="width: 56px; height: 56px; flex-shrink: 0; background: var(--pill); border: 1px solid var(--well); border-radius: 18px; box-shadow: var(--sh-elev-md); display: flex; align-items: center; justify-content: center; color: var(--ink-0);">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg>
    </div>
    <div style="flex: 1; height: 56px; background: var(--pill); border: 1px solid var(--well); border-radius: 18px; box-shadow: var(--sh-elev-md); display: flex; align-items: center; gap: 10px; padding: 0 8px 0 14px;">
      <span style="flex: 1; font-size: 14px; color: var(--ink-2);">Add, search, or /command…</span>
      <div style="width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--honey-ink);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"></path></svg>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
